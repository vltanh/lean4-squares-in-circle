<svg xmlns="http://www.w3.org/2000/svg" width="428" height="428" viewBox="0 0 428 428" role="img" aria-label="The 12-gon of five squares, in the quadrant a, b at least 0, lies inside the unit disk and touches it at (1, 0) and (0, 1)">
<title>The 12-gon of five squares, in the quadrant a, b at least 0, lies inside the unit disk and touches it at (1, 0) and (0, 1)</title>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/></marker></defs>
<rect width="100%" height="100%" fill="#ffffff"/>
<polygon points="60.0,368.0 340.0,368.0 307.0,268.9 159.1,121.0 60.0,88.0" fill="#ffedd5" stroke="#ea580c" stroke-width="2" fill-opacity="1"/>
<path d="M 340.0 368.0 A 280.0 280.0 0 0 0 60.0 88.0" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round"/>
<line x1="32.0" y1="368.0" x2="401.6" y2="368.0" stroke="#1f2937" stroke-width="1" marker-end="url(#arrow)"/>
<line x1="60.0" y1="396.0" x2="60.0" y2="26.4" stroke="#1f2937" stroke-width="1" marker-end="url(#arrow)"/>
<text x="401.6" y="384.8" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-style="italic">a</text>
<text x="43.2" y="32.0" font-size="15" font-family="Georgia, 'Times New Roman', serif" fill="#1f2937" text-anchor="end" dominant-baseline="middle" font-style="italic">b</text>
<text x="158.0" y="270.0" font-size="16" font-family="Georgia, 'Times New Roman', serif" fill="#ea580c" text-anchor="middle" dominant-baseline="middle" font-style="italic">P<tspan dy="4.8" font-size="10.9">5</tspan></text>
<text x="298.0" y="130.0" font-size="13" font-family="Georgia, 'Times New Roman', serif" fill="#2563eb" text-anchor="start" dominant-baseline="middle">a² + b² = 1</text>
</svg>
