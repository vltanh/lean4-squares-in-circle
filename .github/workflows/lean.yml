name: Lean build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build, audit axioms, run checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The default target covers the established n <= 5 entry point.
      - uses: leanprover/lean-action@v1
        with:
          axiom-audit: true
      - name: Axiom audit and sanity checks
        run: |
          lake env lean AxiomAudit.lean
          lake env lean SanityChecks.lean
      # Seven is an optional entry point and must be built explicitly.
      # A clean axiom list for a conditional theorem does not prove its hypotheses.
      - name: Build seven-square development
        run: lake build SquaresInCircles.Seven
      - name: Seven-square audit and sanity checks
        run: |
          lake env lean SevenAxiomAudit.lean
          lake env lean SevenSanityChecks.lean
